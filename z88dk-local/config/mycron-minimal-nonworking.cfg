#
# Target configuration file for z88dk
#


# ----------------------------------------------------------------------
# Mycron / MYCROP target additions
# ----------------------------------------------------------------------

-clib=classic
-compiler=sccz80
-zorg=0x3000

-zorg=0x3000

-pragma-define:REGISTER_SP=0xfff0
-pragma-define:CRT_ENABLE_EIDI=0

-pragma-redirect:fputc_cons=mycron_fputc_cons
-pragma-redirect:fgetc_cons=mycron_fgetc_cons
-pragma-redirect:getk=mycron_getk
-pragma-redirect:getkey=mycron_getkey

#OPTIONS -O2 -clib=classic # -zorg=0x3000 -pragma-define:REGISTER_SP=0xfff0 -pragma-define:CRT_ENABLE_EIDI=0 #  -pragma-redirect:fputc_cons=mycron_fputc_cons -pragma-redirect:fgetc_cons=mycron_fgetc_cons -pragma-redirect:getk=mycron_getk -pragma-redirect:getkey=mycron_getkey



# this is full path as seen in the docker container, which means an extra -v is required.
# -I/z88dk-local/target/mycron/classic/mycron_stdio.asm
-I/z88dk-local/target/mycron/include

/z88dk-local/target/mycron/classic/mycron_stdio.asm

